name: Profile stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@released
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_1 || github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --staged --quiet || git commit -m "chore: update profile stats"
          git push
